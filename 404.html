<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <script>
    (function () {
      var appDomain = "https://app.artistmanagers.io";
      var path = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      window.location.replace(appDomain + path + search + hash);
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=https://app.artistmanagers.io/" />
  </noscript>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    a {
      color: #ED1B24;
    }
  </style>
</head>
<body>
  <div>
    <h1>Redirecting...</h1>
    <p>
      If you are not redirected automatically,
      <a href="https://app.artistmanagers.io/">click here</a>.
    </p>
  </div>
</body>
</html>
